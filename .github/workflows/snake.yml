name: snake

# Redraws the contribution snake once a day and publishes it to the `output` branch,
# which the README reads from.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Top-languages cards, built here because the public github-readme-stats server was shut down.
      # Run before snk: snk runs in Docker as root and leaves dist/ unwritable.
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=alishir99&layout=compact&hide=jupyter%20notebook%2Chtml%2Ccss%2Cshell%2Cplpgsql%2Cbatchfile&langs_count=4&custom_title=Top%20languages&hide_border=true&bg_color=00000000&title_color=1D1D1F&text_color=6E6E73
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=alishir99&layout=compact&hide=jupyter%20notebook%2Chtml%2Ccss%2Cshell%2Cplpgsql%2Cbatchfile&langs_count=4&custom_title=Top%20languages&hide_border=true&bg_color=00000000&title_color=F5F5F7&text_color=A1A1A6
          path: dist/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0071e3
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2997ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
